[package]
name = "savinggrace-agent"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "SavingGrace system agent (Windows service, rule engine, local IPC)"
license-file = "../../LICENSE"
publish = false

[lib]
name = "savinggrace_agent"
path = "src/lib.rs"

[[bin]]
name = "savinggrace-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
